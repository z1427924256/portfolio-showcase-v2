<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>作品集 · Portfolio Showcase</title>
<meta name="description" content="精选设计作品集在线展示，支持高清翻页浏览。点击查看完整作品内容。">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:title" content="作品集 · Portfolio Showcase">
<meta property="og:description" content="精选设计作品集在线展示，支持高清翻页浏览。">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="/guide">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #f5f5f7; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 80px;
  }
  header { text-align: center; margin-bottom: 44px; width: 100%; max-width: 900px; }
  header h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    color: #1d1d1f;
    letter-spacing: -0.02em;
  }
  header p {
    margin-top: 12px;
    font-size: 15px;
    color: #86868b;
    line-height: 1.6;
  }
  #grid {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .card {
    display: block;
    text-decoration: none;
    background: #fff;
    border-radius: 18px;
    padding: 28px 24px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    transition: transform .2s ease, box-shadow .2s ease;
    position: relative;
    overflow: hidden;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .card:hover, .card:active {
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
  }
  .card .t {
    font-size: 20px;
    font-weight: 600;
    color: #1d1d1f;
    line-height: 1.35;
    word-break: break-all;
  }
  .card .m {
    margin-top: 14px;
    font-size: 13px;
    color: #a0a0a6;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card .m .dot { width: 4px; height: 4px; border-radius: 50%; background: #d2d2d7; }
  .card .lock {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    font-size: 12px;
    color: #a0a0a6;
    background: #f5f5f7;
    border-radius: 999px;
    padding: 3px 10px;
    width: fit-content;
  }
  .card .lock svg { width: 11px; height: 11px; fill: #a0a0a6; }
  .card .arrow {
    position: absolute;
    right: 22px;
    bottom: 26px;
    width: 20px;
    height: 20px;
    fill: #c8c8cd;
    transition: transform .2s ease, fill .2s ease;
  }
  .card:hover .arrow { transform: translateX(4px); fill: #86868b; }
  #empty {
    display: none;
    text-align: center;
    color: #86868b;
    font-size: 15px;
    padding: 60px 0;
  }
  #empty a { color: #0071e3; text-decoration: none; }
  footer {
    margin-top: 70px;
    font-size: 12px;
    color: #c8c8cd;
    text-align: center;
  }
  footer a { color: #a0a0a6; text-decoration: none; }
  #skel { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .sk {
    height: 150px;
    border-radius: 18px;
    background: linear-gradient(90deg, #ececed 25%, #f5f5f7 50%, #ececed 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>
<header>
  <h1 id="site-title">作品集</h1>
  <p id="site-sub">点击卡片查看完整作品</p>
</header>

<div id="skel">
  <div class="sk"></div><div class="sk"></div>
</div>

<div id="grid" style="display:none"></div>

<div id="empty">
  暂无作品集<br><br>
  <a href="/admin">前往后台上传 →</a>
</div>

<footer>
  <a href="/admin">管理入口</a>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s || '').replace(/[&<>"']/g, (m) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

(async () => {
  try {
    const r = await fetch('/api/config', { cache: 'no-store' });
    const d = await r.json();
    if (d.ok && d.config) {
      const cfg = d.config;
      if (cfg.site_title) {
        document.title = cfg.site_title;
        $('site-title').textContent = cfg.site_title;
        // 同步 OG 标签（SEO 主体在静态 meta，此处做增强）
        const ogT = document.querySelector('meta[property="og:title"]');
        if (ogT) ogT.setAttribute('content', cfg.site_title);
      }
      // 站点描述（站点设置）
      if (cfg.description) {
        $('site-sub').textContent = cfg.description;
        const ogD = document.querySelector('meta[property="og:description"]');
        if (ogD) ogD.setAttribute('content', cfg.description);
        const mD = document.querySelector('meta[name="description"]');
        if (mD) mD.setAttribute('content', cfg.description);
      }
      // 网站图标（站点设置）
      if (cfg.favicon_version > 0) {
        let fav = document.querySelector("link[rel='icon']");
        if (!fav) { fav = document.createElement('link'); fav.rel = 'icon'; document.head.appendChild(fav); }
        fav.href = '/api/file/favicon?v=' + cfg.favicon_version;
      }
    }

    // 作品集列表（已发布）
    const list = (d.ok && d.portfolios) ? d.portfolios : [];
    $('skel').style.display = 'none';
    if (!list.length) {
      $('empty').style.display = 'block';
      return;
    }
    const grid = $('grid');
    grid.style.display = '';
    const lockSvg = '<svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9z"/></svg>';
    list.forEach((p) => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = '/' + encodeURIComponent(p.slug);
      a.innerHTML =
        '<div><div class="t">' + esc(p.title) + '</div>' +
        (p.protected ? '<span class="lock">' + lockSvg + '已加密</span>' : '') +
        '</div>' +
        '<div class="m"><span>' + (p.page_count || 0) + ' 页</span><span class="dot"></span><span>/ ' + esc(p.slug) + '</span></div>' +
        '<svg class="arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
      grid.appendChild(a);
    });
  } catch (e) {
    $('skel').style.display = 'none';
    $('empty').style.display = 'block';
    $('empty').innerHTML = '加载失败，请刷新重试';
  }
})();
</script>
</body>
</html>
